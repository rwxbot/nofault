<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 920" width="1200" height="920" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="920" fill="#ffffff"/>
  <text x="40" y="44" font-size="24" font-weight="700" fill="#0f172a">nofault v0.3.0 架构图 · 运行时基座</text>
  <text x="40" y="68" font-size="13" fill="#64748b">请求上下文（AsyncLocalStorage）+ REQUEST 作用域 + 配置热更新 + traceId 日志 + 健康探针</text>

  <!-- 请求链路 -->
  <rect x="40" y="90" width="700" height="330" rx="10" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="56" y="112" font-size="12" font-weight="600" fill="#0f766e">请求链路（每请求）</text>

  <rect x="60" y="124" width="150" height="46" rx="8" fill="#ffffff" stroke="#5eead4" stroke-width="1.5"/>
  <text x="135" y="145" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="middle">node:http</text>
  <text x="135" y="162" font-size="11" fill="#64748b" text-anchor="middle">请求进入</text>

  <rect x="228" y="124" width="176" height="46" rx="8" fill="#ffffff" stroke="#5eead4" stroke-width="1.5"/>
  <text x="316" y="145" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="middle">RequestContext</text>
  <text x="316" y="162" font-size="11" fill="#64748b" text-anchor="middle">继承 traceparent / 新开 trace</text>

  <rect x="422" y="124" width="150" height="46" rx="8" fill="#ffffff" stroke="#5eead4" stroke-width="1.5"/>
  <text x="497" y="145" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="middle">ALS store.run</text>
  <text x="497" y="162" font-size="11" fill="#64748b" text-anchor="middle">contextId = 上下文对象</text>

  <rect x="590" y="124" width="130" height="46" rx="8" fill="#ffffff" stroke="#5eead4" stroke-width="1.5"/>
  <text x="655" y="145" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="middle">路由匹配</text>
  <text x="655" y="162" font-size="11" fill="#64748b" text-anchor="middle">Radix 树</text>

  <path d="M 210 147 L 226 147" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <path d="M 404 147 L 420 147" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <path d="M 572 147 L 588 147" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#a)"/>

  <rect x="60" y="192" width="660" height="46" rx="8" fill="#ffffff" stroke="#5eead4" stroke-width="1.5"/>
  <text x="390" y="214" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="middle">中间件链（requestContext 必须最前 · cors · 安全头 · bodyParser）</text>
  <text x="390" y="231" font-size="11" fill="#64748b" text-anchor="middle">中间件复用框架已建立的上下文，不再套第二层</text>

  <rect x="60" y="258" width="320" height="52" rx="8" fill="#ecfdf5" stroke="#34d399" stroke-width="1.5"/>
  <text x="220" y="280" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="middle">每请求解析控制器</text>
  <text x="220" y="297" font-size="11" fill="#64748b" text-anchor="middle">app.get(Controller, contextId)</text>

  <rect x="400" y="258" width="320" height="52" rx="8" fill="#ecfdf5" stroke="#34d399" stroke-width="1.5"/>
  <text x="560" y="280" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="middle">REQUEST 作用域 Provider</text>
  <text x="560" y="297" font-size="11" fill="#64748b" text-anchor="middle">每请求一份 · 请求内共享 · 请求结束释放</text>

  <rect x="60" y="330" width="660" height="46" rx="8" fill="#ffffff" stroke="#5eead4" stroke-width="1.5"/>
  <text x="390" y="352" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="middle">handler → 响应包装 → commit() → clearRequestContext()</text>
  <text x="390" y="369" font-size="11" fill="#64748b" text-anchor="middle">请求结束时释放请求级实例，否则 Map 会无限增长</text>

  <path d="M 655 170 L 655 190" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <path d="M 390 238 L 390 256" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <path d="M 220 310 L 220 328" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <path d="M 560 310 L 560 328" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#a)"/>

  <!-- 依赖作用域传播 -->
  <rect x="760" y="90" width="400" height="150" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="776" y="112" font-size="12" font-weight="600" fill="#b91c1c">Captive dependency 检测（启动期）</text>
  <text x="776" y="136" font-size="11.5" fill="#7f1d1d">单例 Controller → 依赖 REQUEST Service</text>
  <text x="776" y="156" font-size="11.5" fill="#7f1d1d">沿依赖图迭代传播 contextDependent 标记</text>
  <text x="776" y="180" font-size="11.5" fill="#7f1d1d">被污染者按上下文缓存，而非全局单例</text>
  <text x="776" y="206" font-size="11" fill="#991b1b">不处理 → 所有请求共用第一个请求的对象，数据串号</text>
  <text x="776" y="226" font-size="11" fill="#991b1b">且这类 bug 只在并发下偶发，极难排查</text>

  <!-- 配置热更新 -->
  <rect x="760" y="256" width="400" height="164" rx="10" fill="#fefce8" stroke="#eab308" stroke-width="1.5"/>
  <text x="776" y="278" font-size="12" font-weight="600" fill="#a16207">配置热更新</text>
  <rect x="776" y="290" width="114" height="40" rx="6" fill="#ffffff" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="833" y="308" font-size="11.5" font-weight="600" fill="#0f172a" text-anchor="middle">file(watch)</text>
  <text x="833" y="324" font-size="10.5" fill="#64748b" text-anchor="middle">fs.watch + 防抖</text>
  <rect x="898" y="290" width="114" height="40" rx="6" fill="#ffffff" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="955" y="308" font-size="11.5" font-weight="600" fill="#0f172a" text-anchor="middle">polling</text>
  <text x="955" y="324" font-size="10.5" fill="#64748b" text-anchor="middle">etcd/consul/nacos</text>
  <rect x="1020" y="290" width="124" height="40" rx="6" fill="#ffffff" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="1082" y="308" font-size="11.5" font-weight="600" fill="#0f172a" text-anchor="middle">env(最高优先)</text>
  <text x="1082" y="324" font-size="10.5" fill="#64748b" text-anchor="middle">12-factor</text>
  <rect x="776" y="342" width="368" height="34" rx="6" fill="#ffffff" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="960" y="363" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">ConfigRegistry：合并 → 变更则通知订阅者</text>
  <text x="776" y="396" font-size="11" fill="#64748b">values() 不克隆（热路径）；snapshot() 才克隆</text>
  <text x="776" y="412" font-size="11" fill="#64748b">远程拉取失败保留上一次的值，不打挂应用</text>

  <!-- 日志与探针 -->
  <rect x="40" y="440" width="700" height="118" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="56" y="462" font-size="12" font-weight="600" fill="#1d4ed8">可观测性与运维</text>
  <rect x="60" y="474" width="200" height="46" rx="8" fill="#ffffff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="160" y="496" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">contextProvider</text>
  <text x="160" y="512" font-size="10.5" fill="#64748b" text-anchor="middle">每行日志自动带 traceId</text>
  <rect x="272" y="474" width="200" height="46" rx="8" fill="#ffffff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="372" y="496" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">FileTransport</text>
  <text x="372" y="512" font-size="10.5" fill="#64748b" text-anchor="middle">按大小/按天轮转 + 保留 N 份</text>
  <rect x="484" y="474" width="200" height="46" rx="8" fill="#ffffff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="584" y="496" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">/healthz · /readyz</text>
  <text x="584" y="512" font-size="10.5" fill="#64748b" text-anchor="middle">存活与就绪严格分离</text>