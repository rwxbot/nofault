<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 920" width="1200" height="920" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="920" fill="#ffffff"/>
  <text x="40" y="44" font-size="24" font-weight="700" fill="#0f172a">nofault v0.3.0 架构图 · 运行时基座</text>
  <text x="40" y="68" font-size="13" fill="#64748b">请求上下文（AsyncLocalStorage）+ REQUEST 作用域 + 配置热更新 + traceId 日志 + 健康探针</text>

  <!-- 请求链路 -->
  <rect x="40" y="90" width="700" height="330" rx="10" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="56" y="112" font-size="12" font-weight="600" fill="#0f766e">请求链路（每请求）</text>

  <rect x="60" y="124" width="150" height="46" rx="8" fill="#ffffff" stroke="#5eead4" stroke-width="1.5"/>
  <text x="135" y="145" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="middle">node:http</text>
  <text x="135" y="162" font-size="11" fill="#64748b" text-anchor="middle">请求进入</text>

  <rect x="228" y="124" width="176" height="46" rx="8" fill="#ffffff" stroke="#5eead4" stroke-width="1.5"/>
  <text x="316" y="145" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="middle">RequestContext</text>
  <text x="316" y="162" font-size="11" fill="#64748b" text-anchor="middle">继承 traceparent / 新开 trace</text>

  <rect x="422" y="124" width="150" height="46" rx="8" fill="#ffffff" stroke="#5eead4" stroke-width="1.5"/>
  <text x="497" y="145" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="middle">ALS store.run</text>